name: Daily AI News Update & Deploy

on:
  schedule:
    # 毎朝 JST 7:00 (UTC 22:00) に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHubの画面から手動実行ボタンを押せるようにする
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'public/data/news.json'

# GitHub Pages へのデプロイ権限およびコミット権限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: RSSニュース収集 & Gemini API 要約を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/main.py

      - name: 更新されたニュースデータをGitにコミット & プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          if git diff --staged --quiet; then
            echo "ニュースデータに変更はありませんでした。"
          else
            git commit -m "chore: update daily ai news digest [skip ci]"
            git push
          fi

      - name: GitHub Pages 用にアセットをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
