name: Daily AI News Update & Deploy

on:
  schedule:
    # 毎朝 JST 7:00 (UTC 22:00) に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行ボタン
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# GitHub Pages へのデプロイ権限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: RSSニュース収集 & Gemini API 要約を実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/main.py

      - name: GitHub Pages 用にアセットをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
